services:
  postgres:
    image: postgres:16-alpine
    container_name: metaverse-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metaverse
      POSTGRES_PASSWORD: metaverse
      POSTGRES_DB: metaverse
    ports:
      - "5432:5432"
    volumes:
      - metaverse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaverse -d metaverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metaverse-postgres-data:
