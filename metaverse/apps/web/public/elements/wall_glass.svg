<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Top frame -->
  <rect x="0" y="0" width="32" height="6" fill="#4B5563" />
  
  <!-- Glass front -->
  <rect x="0" y="6" width="32" height="26" fill="#60A5FA" opacity="0.4" />
  
  <!-- Side frames -->
  <rect x="0" y="0" width="4" height="32" fill="#374151" />
  <rect x="28" y="0" width="4" height="32" fill="#374151" />
  
  <!-- Glass reflections -->
  <line x1="8" y1="12" x2="20" y2="28" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
  <line x1="14" y1="12" x2="26" y2="28" stroke="#FFFFFF" stroke-width="4" opacity="0.2" />
</svg>
