<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Top surface (lighter) -->
  <rect x="0" y="0" width="32" height="12" fill="#8B4513" />
  <!-- Front face (darker with brick lines) -->
  <rect x="0" y="12" width="32" height="20" fill="#A0522D" />
  
  <!-- Brick lines on front face -->
  <rect x="0" y="16" width="32" height="2" fill="#5C3317" opacity="0.6"/>
  <rect x="0" y="24" width="32" height="2" fill="#5C3317" opacity="0.6"/>
  
  <!-- Vertical brick lines -->
  <rect x="8" y="12" width="2" height="4" fill="#5C3317" opacity="0.6"/>
  <rect x="24" y="12" width="2" height="4" fill="#5C3317" opacity="0.6"/>
  
  <rect x="16" y="18" width="2" height="6" fill="#5C3317" opacity="0.6"/>
  
  <rect x="8" y="26" width="2" height="6" fill="#5C3317" opacity="0.6"/>
  <rect x="24" y="26" width="2" height="6" fill="#5C3317" opacity="0.6"/>
</svg>
