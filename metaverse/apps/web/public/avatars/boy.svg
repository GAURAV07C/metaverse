<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Shadow -->
  <ellipse cx="16" cy="28" rx="8" ry="3" fill="#000000" opacity="0.3" />
  
  <!-- Body (Red shirt, blue pants) -->
  <rect x="11" y="24" width="4" height="4" fill="#1E3A8A" /> <!-- Left Leg -->
  <rect x="17" y="24" width="4" height="4" fill="#1E3A8A" /> <!-- Right Leg -->
  <rect x="10" y="14" width="12" height="10" fill="#EF4444" /> <!-- Shirt -->
  
  <!-- Arms -->
  <rect x="8" y="14" width="2" height="8" fill="#F87171" /> <!-- Left Arm -->
  <rect x="22" y="14" width="2" height="8" fill="#F87171" /> <!-- Right Arm -->
  
  <!-- Hands -->
  <rect x="8" y="22" width="2" height="2" fill="#FDE047" /> <!-- Left Hand -->
  <rect x="22" y="22" width="2" height="2" fill="#FDE047" /> <!-- Right Hand -->
  
  <!-- Head -->
  <rect x="12" y="6" width="8" height="8" fill="#FDE047" /> <!-- Face -->
  
  <!-- Hair -->
  <rect x="11" y="4" width="10" height="3" fill="#451A03" /> <!-- Top Hair -->
  <rect x="11" y="7" width="2" height="4" fill="#451A03" /> <!-- Left Side Hair -->
  <rect x="19" y="7" width="2" height="4" fill="#451A03" /> <!-- Right Side Hair -->
  
  <!-- Eyes -->
  <rect x="13" y="9" width="2" height="2" fill="#000000" />
  <rect x="17" y="9" width="2" height="2" fill="#000000" />
</svg>
