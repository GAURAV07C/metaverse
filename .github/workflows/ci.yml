name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'yarn'
        cache-dependency-path: metaverse/yarn.lock

    - name: Install dependencies
      working-directory: ./metaverse
      run: yarn install --frozen-lockfile

    - name: Format Check
      working-directory: ./metaverse
      run: yarn run format --list-different || echo "Prettier found issues"

    - name: Check Types
      working-directory: ./metaverse
      run: yarn run check-types || echo "Type checking skipped or failed"

    - name: Generate Prisma Client
      working-directory: ./metaverse
      run: yarn run db:generate

    - name: Build Projects
      working-directory: ./metaverse
      run: yarn run build
